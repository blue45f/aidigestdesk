packages:
  - "apps/*"
  - "packages/*"

# pnpm 11: 빌드 스크립트가 있는 패키지는 명시적으로 승인해야 설치가 통과합니다.
onlyBuiltDependencies:
  - esbuild
  - unrs-resolver
  - "@swc/core"
  - "@sentry/cli"
  - protobufjs
allowBuilds:
  esbuild: true
  unrs-resolver: true
  "@swc/core": true
  "@scarf/scarf": false
  '@sentry/cli': true
  # firebase(통합 회원 로그인) 의존성. 이메일/익명 인증엔 빌드 스크립트가 불필요
  # (선택적 native/proto 최적화)하므로 빌드하지 않음 — 설치 통과 + 런타임 정상.
  protobufjs: false
  '@firebase/util': false
minimumReleaseAgeExclude:
  - '@heejun/deskcloud@0.1.0'
